<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Lic. MM Luena</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <!-- EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>

    <!-- Login Section -->
    <div id="loginSection" class="login-container">
        <h2>Acceso Administrativo</h2>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Usuario" required autocomplete="username">
            <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password">
            <button type="submit" id="loginBtn" class="btn">Ingresar</button>
        </form>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboardSection" class="dashboard-container" style="display: none;">
        <header>
            <h1>Panel de Control</h1>
            <button id="logoutBtn" class="btn btn-danger">Cerrar Sesión</button>
        </header>

        <div class="section-card">
            <h2>📅 Gestionar Horarios Disponibles</h2>
            <p>Aquí puedes agregar o quitar los horarios base que aparecen disponibles en el calendario.</p>
            <div id="scheduleEditor" class="days-grid">
                <!-- Se llena dinámicamente con JS -->
                Cargando configuración...
            </div>
        </div>

        <div class="section-card">
            <h2>📋 Próximas Citas</h2>
            <p>Lista de turnos reservados. Puedes cancelar turnos para liberarlos.</p>
            <div id="appointmentsList" class="appointments-list">
                <!-- Se llena dinámicamente -->
                Cargando citas...
            </div>
        </div>
    </div>

    <script>
    // Configuración de Firebase - Copia local para Admin
    const firebaseConfig = {
        apiKey: "AIzaSyDBazSiSwuO2eMPWW4X0MQ7olKlulboeC4",
        authDomain: "mariadelosmilagros-8c2e6.firebaseapp.com",
        projectId: "mariadelosmilagros-8c2e6",
        storageBucket: "mariadelosmilagros-8c2e6.firebasestorage.app",
        messagingSenderId: "127795164134",
        appId: "1:127795164134:web:4218bf7f24e86978e79c27"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Referencia a la colección de citas
    const appointmentsCollection = db.collection('appointments');

    // Configuración de EmailJS
    const emailjsConfig = {
        publicKey: "YVBulg3By7Z4rFbWZ",
        serviceId: "service_09wfwoq",
        templateClientId: "template_norlx65",
        templatePsychologistId: "template_lwscxqp"
    };

    // Inicializar EmailJS
    (function() {
        emailjs.init(emailjsConfig.publicKey);
    })();

    // Exportar para usar en otros archivos
    window.firebaseDB = {
        db,
        appointmentsCollection
    };

    window.emailjsConfig = emailjsConfig;

    // --- APP LOGIC ---

    // Credenciales (Básico - Lado del cliente)
    const USER = "mililuena@yahoo.com.ar";
    const PASS = "Mililuena1";

    // Login
    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault(); // Prevenir recarga del formulario
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (email === USER && password === PASS) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
            initDashboard();
        } else {
            alert('Credenciales incorrectas');
        }
    });

    // Inicializar Dashboard
    async function initDashboard() {
        await loadScheduleConfig();
        await loadAppointments();
    }

    // --- GESTIÓN DE HORARIOS ---
    const daysMap = {
        1: 'Lunes', 2: 'Martes', 3: 'Miércoles', 4: 'Jueves', 5: 'Viernes', 6: 'Sábado', 0: 'Domingo'
    };

    let currentSchedule = {};

    async function loadScheduleConfig() {
        try {
            const docRef = window.firebaseDB.db.collection('config_gral').doc('horarios');
            const doc = await docRef.get();
            
            if (doc.exists) {
                currentSchedule = doc.data();
            } else {
                // Valores por defecto si no existe
                currentSchedule = {
                    1: ['09:00', '10:00', '11:00', '14:00', '15:00', '16:00'],
                    2: ['09:00', '10:00', '11:00', '14:00', '15:00', '16:00'],
                    3: ['09:00', '10:00', '11:00', '14:00', '15:00', '16:00'],
                    4: ['09:00', '10:00', '11:00', '14:00', '15:00', '16:00'],
                    5: ['09:00', '10:00', '11:00', '14:00', '15:00'],
                    6: [], 0: []
                };
            }
            renderScheduleEditor();
        } catch (error) {
            console.error("Error cargando horarios:", error);
            alert("Error cargando configuración de horarios. Revisa la consola.");
        }
    }

    function renderScheduleEditor() {
        const container = document.getElementById('scheduleEditor');
        container.innerHTML = '';

        // Ordenar días: Lunes (1) a Domingo (0)
        const order = [1, 2, 3, 4, 5, 6, 0];

        order.forEach(dayNum => {
            const hours = currentSchedule[dayNum] || [];
            // Ordenar horas
            hours.sort();

            const dayCard = document.createElement('div');
            dayCard.className = 'day-card';
            
            let hoursHtml = hours.map(h => `
                <span class="hour-tag">
                    ${h} <span class="remove-hour" onclick="removeHour(${dayNum}, '${h}')">×</span>
                </span>
            `).join('');

            dayCard.innerHTML = `
                <div class="day-header">${daysMap[dayNum]}</div>
                <div class="hours-list">${hoursHtml}</div>
                <div class="add-hour-form">
                    <input type="time" id="newTime-${dayNum}">
                    <button class="btn btn-success" style="padding: 2px 10px;" onclick="addHour(${dayNum})">+</button>
                </div>
            `;
            container.appendChild(dayCard);
        });
    }

    window.addHour = async (dayNum) => {
        const timeInput = document.getElementById(`newTime-${dayNum}`);
        const time = timeInput.value;
        
        if (!time) return;
        
        if (!currentSchedule[dayNum]) currentSchedule[dayNum] = [];
        if (currentSchedule[dayNum].includes(time)) {
            alert('Ese horario ya existe');
            return;
        }

        currentSchedule[dayNum].push(time);
        await saveSchedule();
    };

    window.removeHour = async (dayNum, time) => {
        if (!confirm(`¿Eliminar horario ${time} del ${daysMap[dayNum]}?`)) return;
        
        currentSchedule[dayNum] = currentSchedule[dayNum].filter(h => h !== time);
        await saveSchedule();
    };

    async function saveSchedule() {
        try {
            await window.firebaseDB.db.collection('config_gral').doc('horarios').set(currentSchedule);
            renderScheduleEditor();
        } catch (e) {
            console.error(e);
            alert('Error al guardar cambio');
        }
    }

    // --- GESTIÓN DE CITAS ---
    async function loadAppointments() {
        const list = document.getElementById('appointmentsList');
        list.innerHTML = 'Cargando...';

        try {
            // Traer citas futuras (podrías filtrar por fecha aqui)
            const snapshot = await window.firebaseDB.appointmentsCollection
                .orderBy('date', 'desc')
                .orderBy('time', 'asc')
                .limit(50)
                .get();

            list.innerHTML = '';
            
            if (snapshot.empty) {
                list.innerHTML = '<p>No hay citas registradas</p>';
                return;
            }

            snapshot.forEach(doc => {
                const data = doc.data();
                const id = doc.id;
                // Simple date format fix
                let dateStr = data.date;
                try {
                     const parts = data.date.split('-'); 
                     if(parts.length === 3) dateStr = `${parts[2]}/${parts[1]}/${parts[0]}`;
                } catch(e) {}

                const item = document.createElement('div');
                item.className = 'appointment-item';
                item.innerHTML = `
                    <div>
                        <strong>${dateStr} - ${data.time} hs</strong><br>
                        Paciente: ${data.clientName}<br>
                        <small>📞 ${data.clientPhone} | 📧 ${data.clientEmail}</small>
                    </div>
                    <button class="btn btn-danger" onclick="cancelAppointment('${id}')">Cancelar</button>
                `;
                list.appendChild(item);
            });

        } catch (e) {
            console.error(e);
            list.innerHTML = 'Error cargando citas';
        }
    }

    window.cancelAppointment = async (id) => {
        if (!confirm('¿Seguro que deseas cancelar esta cita? Esta acción liberará el turno.')) return;

        try {
            await window.firebaseDB.appointmentsCollection.doc(id).delete();
            loadAppointments();
            alert('Cita cancelada correctamente');
        } catch (e) {
            console.error(e);
            alert('Error al cancelar cita');
        }
    };

    document.getElementById('logoutBtn').addEventListener('click', () => {
        location.reload();
    });
    </script>
</body>
</html>
